<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Rendez-Vous Café & Eatery</title>
	<!-- Google Fonts: Battambang -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1edea;
            --card-bg: #162033;
            --accent: #f59e0b;
            --border-color: #233554;
            --text-dark: #111827;
            --text-sub: #64748b;
            --text-btn: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Battambang",-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Kantumruy Pro", "Noto Sans SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            min-height: 100vh;
        }
		
		.tag, .label, .lang-btn, p.subtitle {
			font-family: "Battambang", sans-serif;
			line-height: 1.4;
		}

.tag {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
}

.label {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-btn);
}
		
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
        }
        .brand-logo {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
        }
        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
        }

        /* Real-time Clock & Date */
        .datetime-box {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(22, 32, 51, 0.85);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
        }
        .live-date { color: #cbd5e1; font-weight: 500; }
        .datetime-separator { color: #64748b; }
        .live-time { font-weight: 700; color: var(--accent); }

        /* 3-Language Switcher */
        .lang-switch {
            display: flex;
            gap: 8px;
            margin-top: -2px;
        }
        .lang-btn {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: var(--card-bg);
            color: var(--accent);
            border-color: var(--card-bg);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* Links Group */
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--card-bg);
            color: var(--text-btn) !important;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .link-btn:active { transform: scale(0.98); }
        .link-btn:hover { border-color: var(--accent); }
        .tag {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: var(--accent);
        }
        .label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-btn);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand Logo -->
        <img src="rdv-logo.png" alt="Le Rendez-Vous Logo" class="brand-logo">

        <h1>Le Rendez-Vous Café & Eatery</h1>

        <!-- Live Clock -->
        <div class="datetime-box">
            <span id="live-date" class="live-date">Loading date...</span>
            <span class="datetime-separator">|</span>
            <span id="live-time" class="live-time">--:--:--</span>
        </div>

        <!-- 3-Language Switcher: EN, ខ្មែរ, 中文 -->
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" onclick="setLanguage('km')">ខ្មែរ</button>
            <button class="lang-btn" onclick="setLanguage('zh')">中文</button>
        </div>

        <p class="subtitle" id="ui-subtitle">Select an option below</p>

        <!-- Menu Links Group -->
        <div class="links-group">
            <a href="https://heyzine.com/flip-book/ed3e862933.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-breakfast">BREAKFAST MENU</span>
                <span class="label" id="l-breakfast">🍳 Food Menu</span>
            </a>
            <a href="https://heyzine.com/flip-book/bef597a438.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-lunch">LUNCH & DINNER MENU</span>
                <span class="label" id="l-lunch">🍲 Main Course</span>
            </a>
            <a href="https://heyzine.com/flip-book/7662403942.html" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-drink">DRINK MENU</span>
                <span class="label" id="l-drink">☕ Beverages</span>
            </a>
            <a href="https://web.facebook.com/lerendezvous.rdv" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-fb">FACEBOOK PAGE</span>
                <span class="label" id="l-fb">📘 Facebook</span>
            </a>
            <a href="https://www.instagram.com/rendezvouscafe.rdv/" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-ig">INSTAGRAM PROFILE</span>
                <span class="label" id="l-ig">📷 Instagram</span>
            </a>
            <a href="https://maps.app.goo.gl/m9ckKBJBx13kZ93Q6" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="tag" id="t-map">RDV CAFE & EATERY MAP</span>
                <span class="label" id="l-map">📍 Map</span>
            </a>
        </div>
    </div>

    <script>
        let currentLang = 'en';

        const translations = {
            en: {
                locale: 'en-US',
                subtitle: 'Select an option below',
                t_breakfast: 'BREAKFAST MENU',
                l_breakfast: '🍳 Food Menu',
                t_lunch: 'LUNCH & DINNER MENU',
                l_lunch: '🍲 Main Course',
                t_drink: 'DRINK MENU',
                l_drink: '☕ Beverages',
                t_fb: 'FACEBOOK PAGE',
                l_fb: '📘 Facebook',
                t_ig: 'INSTAGRAM PROFILE',
                l_ig: '📷 Instagram',
                t_map: 'RDV CAFE & EATERY MAP',
                l_map: '📍 Map'
            },
            km: {
                locale: 'km-KH',
                subtitle: 'សូមជ្រើសរើសជម្រើសខាងក្រោម',
                t_breakfast: 'មីនុយអាហារពេលព្រឹក',
                l_breakfast: '🍳 មុខម្ហូប',
                t_lunch: 'មីនុយថ្ងៃត្រង់ និងពេលល្ងាច',
                l_lunch: '🍲 ម្ហូបចម្បង',
                t_drink: 'មីនុយភេសជ្ជៈ',
                l_drink: '☕ ភេសជ្ជៈ',
                t_fb: 'ទំព័រហ្វេសប៊ុក',
                l_fb: '📘 Facebook',
                t_ig: 'ទំព័រអុីនស្តាក្រាម',
                l_ig: '📷 Instagram',
                t_map: 'ផែនទីហាង RDV',
                l_map: '📍 ទីតាំង'
            },
            zh: {
                locale: 'zh-CN',
                subtitle: '请选择以下选项',
                t_breakfast: '早餐菜单',
                l_breakfast: '🍳 美食菜单',
                t_lunch: '午餐与晚餐菜单',
                l_lunch: '🍲 主食菜品',
                t_drink: '饮品菜单',
                l_drink: '☕ 特色饮品',
                t_fb: '脸书专页',
                l_fb: '📘 Facebook',
                t_ig: '照片墙主页',
                l_ig: '📷 Instagram',
                t_map: '餐厅地图导航',
                l_map: '📍 查看地图'
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('ui-subtitle').textContent = t.subtitle;
            document.getElementById('t-breakfast').textContent = t.t_breakfast;
            document.getElementById('l-breakfast').textContent = t.l_breakfast;
            document.getElementById('t-lunch').textContent = t.t_lunch;
            document.getElementById('l-lunch').textContent = t.l_lunch;
            document.getElementById('t-drink').textContent = t.t_drink;
            document.getElementById('l-drink').textContent = t.l_drink;
            document.getElementById('t-fb').textContent = t.t_fb;
            document.getElementById('l-fb').textContent = t.l_fb;
            document.getElementById('t-ig').textContent = t.t_ig;
            document.getElementById('l-ig').textContent = t.l_ig;
            document.getElementById('t-map').textContent = t.t_map;
            document.getElementById('l-map').textContent = t.l_map;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                const text = btn.textContent.trim();
                const isActive = (lang === 'en' && text === 'EN') ||
                                 (lang === 'km' && text === 'ខ្មែរ') ||
                                 (lang === 'zh' && text === '中文');
                btn.classList.toggle('active', isActive);
            });

            updateLiveDateTime();
        }

        function updateLiveDateTime() {
            const now = new Date();
            const loc = translations[currentLang].locale;

            const dateString = now.toLocaleDateString(loc, { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });

            const timeString = now.toLocaleTimeString(loc, { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                hour12: true 
            });

            document.getElementById('live-date').textContent = dateString;
            document.getElementById('live-time').textContent = timeString;
        }

        updateLiveDateTime();
        setInterval(updateLiveDateTime, 1000);
    </script>
</body>
</html>
